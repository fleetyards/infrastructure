name: Deploy

on:
  workflow_run:
    workflows: ["Main"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        type: choice
        options:
          - stage
          - live

jobs:
  stage:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'stage')
    runs-on: ubuntu-latest
    environment: Stage
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Init
        run: terraform init

      - name: Select workspace
        run: terraform workspace select stage

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan

  live-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'live'
    runs-on: ubuntu-latest
    environment: Live Plan
    outputs:
      has_changes: ${{ steps.summary.outputs.has_changes }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Init
        run: terraform init

      - name: Select workspace
        run: terraform workspace select live

      - name: Plan
        run: terraform plan -out=tfplan

      # The apply job waits for approval on the Live environment; this is what
      # the reviewer reads there before approving.
      - name: Summarise plan
        id: summary
        run: |
          terraform show -json tfplan > plan.json
          count() { jq "[.resource_changes[]? | select(.change.actions | $1)] | length" plan.json; }
          ADDS=$(count 'contains(["create"])')
          CHANGES=$(count '. == ["update"]')
          DESTROYS=$(count 'contains(["delete"])')
          if [ "$((ADDS + CHANGES + DESTROYS))" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Live plan: $ADDS to add, $CHANGES to change, $DESTROYS to destroy"
            echo
            jq -r '.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "- `\(.address)`: \(.change.actions | join(", "))"' plan.json
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for destructive changes
        run: |
          DESTROYS=$(jq '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length' plan.json)
          REPLACES=$(jq '[.resource_changes[]? | select(.change.actions | contains(["delete", "create"]))] | length' plan.json)
          echo "Resources to destroy: $DESTROYS"
          echo "Resources to replace: $REPLACES"
          if [ "$DESTROYS" -gt 0 ] || [ "$REPLACES" -gt 0 ]; then
            echo "::error::Plan contains destructive changes ($DESTROYS destroys, $REPLACES replacements). Live deploy blocked."
            exit 1
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: live-tfplan
          path: tfplan

  live-apply:
    needs: live-plan
    if: needs.live-plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: Live
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Init
        run: terraform init

      - name: Select workspace
        run: terraform workspace select live

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: live-tfplan

      - name: Apply
        run: terraform apply tfplan
